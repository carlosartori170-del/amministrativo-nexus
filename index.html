<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Amministrativo Nexus</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#17342b;background:#f3f7f4;font-size:15px}*{box-sizing:border-box}
    body{margin:0}.hidden{display:none!important}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .shell{max-width:1280px;margin:auto;padding:25px 22px 64px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:13px}.mark{background:#14624d;color:white;font-size:24px;font-weight:800;width:46px;height:46px;border-radius:13px;display:grid;place-items:center}
    h1{font-size:23px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 11px}.sub{font-size:12px;color:#658076;margin-top:3px}
    .header-actions{display:flex;align-items:center;gap:10px}.nav{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:24px}.nav button{border:1px solid #d8e6dc;background:white;color:#315549;padding:10px 17px;border-radius:11px;font-weight:650}
    .nav button.active{background:#14624d;color:white;border-color:#14624d}.btn{border:0;border-radius:10px;background:#14624d;color:white;padding:11px 17px;font-weight:700}.btn.secondary{background:#e8f2ec;color:#1b6047}.btn.danger{background:#fbe9e6;color:#a84033}.btn.small{font-size:12px;padding:7px 10px}
    .card{background:white;border:1px solid #e1eae4;border-radius:17px;padding:19px;box-shadow:0 4px 17px #17342b08}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric strong{display:block;font-size:25px;margin-top:12px;letter-spacing:-.7px}.metric span{font-size:13px;color:#698176}.metric.positive strong{color:#12744f}.metric.negative strong{color:#b04c37}
    .row{display:flex;align-items:center;justify-content:space-between;gap:16px}.stack{display:grid;gap:17px}.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:17px}.muted{color:#688077}.pill{display:inline-block;border-radius:30px;padding:5px 9px;background:#e8f3ec;color:#21644b;font-size:12px;font-weight:700}
    .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls label{font-size:13px;color:#60796c}input,select,textarea{background:white;color:#17342b;border:1px solid #c9d9ce;border-radius:9px;padding:10px 11px;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #82bfa0;border-color:#197554}
    .field{display:grid;gap:6px;font-size:13px;font-weight:650;color:#365849}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.wide{grid-column:span 2}.full{grid-column:1/-1}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:12px;color:#678072;background:#f7faf8}td,th{padding:11px 13px;border-bottom:1px solid #edf1ed}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}tr.clickable{cursor:pointer}tr.clickable:hover{background:#f3faf5}
    .bar-track{width:100%;height:9px;background:#edf2ee;border-radius:10px;overflow:hidden}.bar{height:100%;background:#229365;border-radius:10px}
    .notice{background:#edf6ef;border:1px solid #cbe4d0;border-radius:11px;padding:12px 15px;color:#385d48;font-size:13px}.alert{background:#fff2ed;border-color:#f6d5c6;color:#97513d}
    .quote-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.quote-item{background:#f7faf8;border-radius:10px;padding:9px}.quote-item label{display:grid;gap:4px;font-size:12px;color:#557365}.quote-item input{width:100%}
    .login{max-width:420px;margin:11vh auto 0}.login .card{padding:28px}.login form{display:grid;gap:13px;margin-top:24px}.empty{padding:27px;text-align:center;color:#729083}.status{font-size:12px;color:#517461}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
    @media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quote-list{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:17px 12px 50px}}
    @media(max-width:510px){.grid,.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.header-actions{flex-wrap:wrap;justify-content:flex-end}.top{align-items:flex-start}h1{font-size:19px}.quote-list{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div id="login" class="login shell hidden"><div class="card"><div class="brand"><div class="mark">N</div><div><h1>Amministrativo Nexus</h1><div class="sub">Accesso riservato</div></div></div><form id="loginForm"><label class="field">Email<input id="email" type="email" autocomplete="username" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn">Accedi</button><div id="loginError" class="status" role="alert"></div></form></div></div>
<div id="app" class="shell hidden"><header class="top"><div class="brand"><div class="mark">N</div><div><h1>Amministrativo Nexus</h1><div class="sub">Bilancino e attività amministrative</div></div></div><div class="header-actions"><span id="userEmail" class="sub"></span><button class="btn secondary small" id="logout">Esci</button></div></header>
  <nav class="nav" id="nav"><button data-page="bilancino" class="active">Bilancino</button><button data-page="fatture">Fatture ricevute</button><button data-page="ricavi">Ricavi</button><button data-page="categorie">Categorie</button></nav>
  <div id="feedback" class="hidden notice" role="status" style="margin-bottom:16px"></div>
  <main id="main"></main>
</div>
<script id="seed" type="application/json">{"categories":{"Ricavi":"ricavo","Costo Personale":"costo","Costo Personale +":"costo","Costo Manutenzione Mezzi":"costo","Costo Noleggio Mezzi":"costo","Affitto Ufficio":"costo","Affitto Grocery":"costo","Bollette":"costo","Nolo Auto":"costo","Spese Amministrative":"costo","Sicurezza":"costo","Vitto":"costo","Vestiario":"costo","Danni-Sinistri":"costo","Attrezzature/Cancelleria/Beni":"costo","Manutenzioni Auto":"costo","Altro":"costo","Privato":"costo","Auto Di Proprieta":"costo","Costo Personale ++":"costo","It":"costo","E Commerce - Attrezzature/Cancelleria":"costo","E Commerce - Marketing":"costo","E-Commerce Spese Amministrative":"costo","E-Commerce Trasporti":"costo"},"history":{}}</script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/+esm';
const seed=JSON.parse(document.getElementById('seed').textContent);
const db=createClient('https://eqtyfnluswalfassmlxd.supabase.co','sb_publishable_QFxWloxs6waJCTvV1jtuPQ_MI7K4foM');
const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n||0));
const num=n=>new Intl.NumberFormat('it-IT',{maximumFractionDigits:2}).format(Number(n||0));
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthName=m=>new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(new Date(m+'-01T12:00:00'));
const monthAdd=(m,n)=>{let [y,mm]=m.split('-').map(Number);let z=new Date(Date.UTC(y,mm-1+n,1));return `${z.getUTCFullYear()}-${String(z.getUTCMonth()+1).padStart(2,'0')}`};
const val=id=>document.getElementById(id)?.value;
const now=new Date();const currentMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const state={page:'bilancino',month:currentMonth,categories:[],movements:[],edit:null,breakdown:null,detail:null,registerMonth:'',invoices:[],rules:[],invoiceFilter:'pending',invoicePreview:[]};
const main=document.getElementById('main');
function notify(message,error=false){const el=document.getElementById('feedback');el.textContent=message;el.className='notice'+(error?' alert':'');el.scrollIntoView({block:'nearest'});}
function category(id){return state.categories.find(c=>c.id===id)}
function summary(month){const by=new Map();for(const c of state.categories)by.set(c.id,{c,history:0,new:0});
  const base=seed.history[month]||{};for(const [name,amount] of Object.entries(base)){const c=state.categories.find(x=>x.storico_nome===name);if(c)by.get(c.id).history+=Number(amount)}
  for(const m of state.movements.filter(x=>!x.annullato&&x.includi_bilancino!==false)){const part=(m.quote||[]).find(q=>q.mese===month);if(part&&by.has(m.categoria_id))by.get(m.categoria_id).new+=Number(part.importo)}
  const rows=[...by.values()].filter(x=>Math.round((x.history+x.new)*100)>0).map(x=>({...x,total:x.history+x.new}));
  const revenue=rows.filter(x=>x.c.tipo==='ricavo').reduce((s,x)=>s+x.total,0);const expense=rows.filter(x=>x.c.tipo==='costo').reduce((s,x)=>s+x.total,0);
  return {rows,revenue,expense,result:revenue-expense,hasData:rows.length>0};}
function page(name){state.page=name;state.breakdown=null;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===name));render()}
function render(){if(state.page==='bilancino')renderBilancino();if(state.page==='ricavi')renderMovimenti();if(state.page==='fatture')renderFatture();if(state.page==='categorie')renderCategorie()}
function renderBilancino(){const s=summary(state.month),margin=s.revenue?s.result/s.revenue*100:0;
  const cats=s.rows.sort((a,b)=>a.c.tipo.localeCompare(b.c.tipo)||a.c.ordine-b.c.ordine);
  const max=Math.max(...cats.filter(x=>x.c.tipo==='costo').map(x=>x.total),1);
  const history=Array.from({length:8},(_,i)=>monthAdd(state.month,i-7)).map(m=>({m,...summary(m)}));
  main.innerHTML=`<div class="section-title"><div><h2>Bilancino Nexus</h2><div class="muted">Vista complessiva dell'azienda, per mese di competenza</div></div><div class="controls"><label for="month">Mese</label><input type="month" id="month" value="${state.month}"><button class="btn secondary small" id="exportCsv">Esporta CSV</button></div></div>
  <div class="card" style="margin-bottom:17px"><div class="row"><div><strong>Inserisci i dati di ${escape(monthName(state.month))}</strong><div class="sub">Registra i ricavi; classifica i costi dei fornitori dalle fatture ricevute, scegliendo il mese di competenza e la ripartizione.</div></div><div class="controls"><button class="btn secondary" id="addRevenue">+ Ricavo</button><button class="btn" id="goInvoices">Fatture ricevute</button></div></div></div>
  <div class="grid" style="margin-bottom:17px"><div class="card metric"><span>Ricavi</span><strong>${euro(s.revenue)}</strong></div><div class="card metric"><span>Costi</span><strong>${euro(s.expense)}</strong></div><div class="card metric ${s.result>=0?'positive':'negative'}"><span>Risultato gestionale</span><strong>${euro(s.result)}</strong></div><div class="card metric"><span>Margine sui ricavi</span><strong>${s.revenue?num(margin)+'%':'—'}</strong></div></div>
  <div class="two"><section class="card"><div class="section-title"><h3>Voci del mese</h3><span class="pill">${monthName(state.month)}</span></div>${cats.length?`<div class="table-wrap"><table><thead><tr><th>Categoria</th><th class="num">Storico Excel</th><th class="num">Nuove voci</th><th class="num">Totale</th></tr></thead><tbody>${cats.map(x=>`<tr class="clickable" data-cat="${x.c.id}"><td>${escape(x.c.nome)}</td><td class="num">${euro(x.history)}</td><td class="num">${euro(x.new)}</td><td class="num"><strong>${euro(x.total)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nessun dato per questo mese. Aggiungi un ricavo o una spesa.</div>'}</section>
  <section class="card"><h3>Andamento recente</h3><div class="stack">${history.map(x=>`<div><div class="row" style="font-size:13px;margin-bottom:6px"><span>${escape(monthName(x.m))}</span><strong style="color:${x.result>=0?'#167653':'#b04c37'}">${x.hasData?euro(x.result):'—'}</strong></div><div class="bar-track"><div class="bar" style="width:${Math.min(100,Math.abs(x.result)/Math.max(...history.map(z=>Math.abs(z.result)),1)*100)}%;background:${x.result>=0?'#229365':'#d6846b'}"></div></div></div>`).join('')}</div></section></div>
  ${seed.history[state.month]?'<div class="notice" style="margin-top:17px">I valori nella colonna “Storico Excel” sono importati dal bilancino originale. Prima di includere una fattura dello stesso periodo, controlla che non sia già compresa nello storico.</div>':''}
  ${state.breakdown?breakdownHtml(state.breakdown):''}`;
  document.getElementById('month').onchange=e=>{state.month=e.target.value;state.breakdown=null;render()};
  document.getElementById('exportCsv').onclick=exportCsv;
  document.getElementById('addRevenue').onclick=()=>openEntry({kind:'ricavo'});
  document.getElementById('goInvoices').onclick=()=>page('fatture');
  main.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{state.breakdown=el.dataset.cat;render()});
  if(state.breakdown){document.getElementById('closeBreakdown').onclick=()=>{state.breakdown=null;render()};document.getElementById('addForCategory').onclick=()=>{if(category(state.breakdown).tipo==='costo'){state.invoiceFilter='all';page('fatture')}else openEntry({kind:'ricavo',categoryId:state.breakdown})}}
}
function breakdownHtml(id){const c=category(id),entries=state.movements.filter(m=>!m.annullato&&m.categoria_id===id&&(m.quote||[]).some(q=>q.mese===state.month));if(!c)return '';
  return `<section class="card" style="margin-top:17px"><div class="section-title"><h3>${escape(c.nome)} · ${escape(monthName(state.month))}</h3><div class="controls"><button class="btn small" id="addForCategory">${c.tipo==='costo'?'Vedi fatture ricevute':'+ Ricavo in questa categoria'}</button><button class="btn secondary small" id="closeBreakdown">Chiudi</button></div></div><div class="muted">Saldo storico Excel: ${euro(seed.history[state.month]?.[c.storico_nome]||0)}</div>${entries.length?`<div class="table-wrap"><table><thead><tr><th>Nuova registrazione</th><th>Documento</th><th class="num">Quota del mese</th></tr></thead><tbody>${entries.map(m=>`<tr><td>${escape(m.descrizione)}</td><td>${escape(m.riferimento||'—')}</td><td class="num">${euro(m.quote.find(q=>q.mese===state.month).importo)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nessuna nuova registrazione in questa categoria.</p>'}</section>`}
function openEntry(options){page('ricavi');showEntry(null,{month:state.month,...options})}
function exportCsv(){const s=summary(state.month);let rows=[['Mese','Tipo','Categoria','Storico Excel','Nuove voci','Totale'],...s.rows.map(x=>[state.month,x.c.tipo,x.c.nome,x.history.toFixed(2),x.new.toFixed(2),x.total.toFixed(2)])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`Amministrativo_Nexus_${state.month}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderMovimenti(){const isExpense=state.page==='spese',kind=isExpense?'costo':'ricavo';const all=state.movements.filter(x=>x.tipo===kind);const rows=all.filter(x=>!state.registerMonth||x.data_documento?.slice(0,7)===state.registerMonth).sort((a,b)=>(b.data_documento||b.creato_il).localeCompare(a.data_documento||a.creato_il));const active=rows.filter(x=>!x.annullato);const total=active.reduce((s,x)=>s+Number(x.importo),0);const detail=all.find(x=>x.id===state.detail);
  main.innerHTML=`<div class="section-title"><div><h2>${isExpense?'Registro spese':'Registro ricavi'}</h2><div class="muted">${isExpense?'Qui trovi la spesa originale e la decisione di ripartirla nei mesi.':'Qui trovi l’importo originale di ciascun ricavo e il relativo mese di competenza.'}</div></div><button class="btn" id="newEntry">+ ${isExpense?'Registra spesa':'Registra ricavo'}</button></div>
  <section id="entryForm" class="card hidden" style="margin-bottom:18px"></section>
  <section class="card" style="margin-bottom:17px"><div class="row"><div><div class="muted">${isExpense?'Totale spese registrate':'Totale ricavi registrati'}${state.registerMonth?' nel mese selezionato':''}</div><div style="font-size:26px;font-weight:800;margin-top:6px">${euro(total)}</div><div class="sub">Importi originali delle registrazioni, prima della ripartizione nel bilancino.</div></div><label class="field">Data del documento: filtra mese<input id="registerMonth" type="month" value="${state.registerMonth}"></label></div></section>
  ${detail?movementDetailHtml(detail):''}
  <section class="card"><div class="section-title"><h3>${isExpense?'Acquisti registrati singolarmente':'Ricavi registrati singolarmente'}</h3><span class="pill">${rows.length} voci</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Data documento</th><th>Descrizione</th><th>${isExpense?'Fornitore':'Riferimento'}</th>${isExpense?'<th class="num">Quantità</th>':''}<th>Categoria</th><th class="num">Importo originale</th><th>Ripartizione</th><th></th></tr></thead><tbody>${rows.map(m=>`<tr><td>${escape(m.data_documento||'—')}</td><td><strong>${escape(m.descrizione)}</strong>${m.annullato?' <span class="pill">Annullata</span>':''}</td><td>${escape(isExpense?m.fornitore||'—':m.riferimento||'—')}</td>${isExpense?`<td class="num">${m.quantita?num(m.quantita):'—'}</td>`:''}<td>${escape(category(m.categoria_id)?.nome||'—')}</td><td class="num"><strong>${euro(m.importo)}</strong></td><td>${m.quote?.length===1?'In un mese':`${m.quote.length} mesi`}</td><td><button class="btn secondary small" data-detail="${m.id}">Vedi dettaglio</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Non ci sono ancora acquisti inseriti singolarmente.</div>'}</section>`;
  document.getElementById('registerMonth').onchange=e=>{state.registerMonth=e.target.value;state.detail=null;render()};
  document.getElementById('newEntry').onclick=()=>showEntry(null,{month:state.month,kind});
  main.querySelectorAll('[data-detail]').forEach(el=>el.onclick=()=>{state.detail=el.dataset.detail;render();document.getElementById('movementDetail')?.scrollIntoView({behavior:'smooth',block:'start'})});
  document.getElementById('editDetail')?.addEventListener('click',()=>showEntry(detail));document.getElementById('closeDetail')?.addEventListener('click',()=>{state.detail=null;render()});document.getElementById('openInvoiceDetail')?.addEventListener('click',()=>{state.invoiceFilter='all';page('fatture')});
}
function movementDetailHtml(m){const schedule=m.quote||[],sum=schedule.reduce((s,q)=>s+Number(q.importo),0);return `<section id="movementDetail" class="card" style="margin-bottom:17px"><div class="section-title"><h3>${escape(m.descrizione)} · ${euro(m.importo)}</h3><div class="controls">${m.fattura_id?'<button class="btn secondary small" id="openInvoiceDetail">Apri fattura</button>':'<button class="btn secondary small" id="editDetail">Modifica</button>'}<button class="btn secondary small" id="closeDetail">Chiudi</button></div></div><div class="grid" style="margin-bottom:17px"><div><div class="muted">${m.tipo==='costo'?'Spesa originale':'Ricavo originale'}</div><strong>${euro(m.importo)}</strong></div><div><div class="muted">Data documento</div><strong>${escape(m.data_documento||'—')}</strong></div><div><div class="muted">Categoria</div><strong>${escape(category(m.categoria_id)?.nome||'—')}</strong></div><div><div class="muted">Fornitore / riferimento</div><strong>${escape(m.fornitore||m.riferimento||'—')}</strong></div></div>${m.quantita?`<p class="muted">Quantità acquistata: <strong>${num(m.quantita)}</strong></p>`:''}${m.riferimento&&m.fornitore?`<p class="muted">Documento: ${escape(m.riferimento)}</p>`:''}${m.note?`<p class="muted">Note: ${escape(m.note)}</p>`:''}<h3>Come è stata distribuita</h3>${schedule.length?`<p class="muted">${schedule.length} ${schedule.length===1?'mese':'mesi'} · dal ${escape(monthName(schedule[0].mese))} al ${escape(monthName(schedule.at(-1).mese))}</p><div class="table-wrap"><table><thead><tr><th>Mese di competenza</th><th class="num">Quota nel bilancino</th></tr></thead><tbody>${schedule.map(q=>`<tr><td>${escape(monthName(q.mese))}</td><td class="num">${euro(q.importo)}</td></tr>`).join('')}<tr><td><strong>Totale ripartito</strong></td><td class="num"><strong>${euro(sum)}</strong></td></tr></tbody></table></div>`:'<p class="muted">Nessuna quota registrata.</p>'}<div class="notice" style="margin-top:12px">L'importo originale è ${euro(m.importo)}. ${m.includi_bilancino===false?'Le quote sono escluse dal bilancino perché già comprese nello storico Excel.':'Nel bilancino compare solo la quota prevista per ciascun mese.'}</div></section>`}
function showEntry(m,options={}){state.edit=m?.id||null;const box=document.getElementById('entryForm');box.classList.remove('hidden');const firstMonth=m?.quote?.[0]?.mese||options.month||'2026-09';const length=m?.quote?.length||1;const preset=[1,3,6,12,24,36].includes(length)?String(length):'custom';const today=new Date();const todayLocal=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  box.innerHTML=`<div class="section-title"><h3>${m?'Modifica registrazione':'Registra '+((options.kind||'costo')==='costo'?'la spesa originale':'il ricavo originale')}</h3><button class="btn secondary small" id="cancelEntry">Chiudi</button></div><div class="notice" style="margin-bottom:15px">Inserisci l'importo intero del documento. La ripartizione sotto stabilisce quanto appare in ciascun bilancino mensile.</div><form id="movementForm" class="form-grid">
  <label class="field">Tipo<select id="kind"><option value="costo">Spesa</option><option value="ricavo">Ricavo</option></select></label>
  <label class="field">Categoria<select id="category" required></select></label>
  <label class="field">Importo totale (€)<input id="amount" type="number" step="0.01" min="0.01" required value="${m?.importo??''}"></label>
  <label class="field wide">Descrizione<input id="description" required maxlength="250" value="${escape(m?.descrizione||'')}"></label>
  <label class="field">Data acquisto / documento<input id="documentDate" type="date" required value="${m?.data_documento||todayLocal}"></label>
  <label class="field" id="supplierField">Fornitore<input id="supplier" maxlength="150" value="${escape(m?.fornitore||'')}"></label>
  <label class="field" id="quantityField">Quantità acquistata<input id="quantity" type="number" min="0.01" step="0.01" value="${m?.quantita??''}" placeholder="Es. 200 giubbotti"></label>
  <label class="field">Numero fattura / riferimento<input id="reference" value="${escape(m?.riferimento||'')}"></label>

function parseInvoicePage(items){const get=(s)=>items.find(i=>i.str?.includes(s));const header=get('Totale imponibile'),tax=get('Totale imposta'),bollo=get('Imposta bollo');

function extractDescriptionItems(items){const head=items.find(i=>i.str?.includes('Cod. articolo')),end=items.find(i=>i.str?.includes('RIEPILOGHI IVA E TOTALI'));if(!head)return [];const qty=items.find(i=>i.str?.trim()==='Quantità'&&Math.abs(i.transform[5]-head.transform[5])<4);const top=head.transform[5],bottom=end?.transform[5]??25,cutoff=(qty?.transform[4]??340)-8;const grouped=new Map();for(const i of items){const x=i.transform[4],y=i.transform[5],value=i.str?.trim();if(!value||x<46||x>=cutoff||y>top-4||y<bottom+3||/^[‐–—-]+$/.test(value))continue;const key=Math.round(y*2)/2;grouped.set(key,[...(grouped.get(key)||[]),{x,value}])}return [...grouped].sort((a,b)=>b[0]-a[0]).map(([,parts])=>parts.sort((a,b)=>a.x-b.x).map(p=>p.value).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean).slice(0,120)}

function invoiceDuration(box){const v=k=>box.querySelector(`[data-field="${k}"]`);return Number(v('durata_mesi').value==='custom'?v('mesi_personalizzati').value:v('durata_mesi').value)}
function drawInvoiceQuotes(box){const v=k=>box.querySelector(`[data-field="${k}"]`),custom=v('durata_mesi').value==='custom',n=invoiceDuration(box),month=v('mese_competenza').value,amount=Number(v('imponibile').value),target=box.querySelector('[data-invoice-quotes]');box.querySelector('[data-custom-months]').classList.toggle('hidden',!custom);if(!/^\d{4}-\d{2}$/.test(month)||!Number.isInteger(n)||n<1||n>120||!Number.isFinite(amount)||amount<=0){target.innerHTML='<div class="status">Inserisci imponibile, mese e durata validi per vedere le quote.</div>';return}const q=equalQuotes(Math.round(amount*100),month,n),included=v('includi_bilancino').checked;target.innerHTML=`<details><summary><strong>${n===1?'Tutto in '+escape(monthName(month)):euro(amount)+' in '+n+' mesi, da '+escape(monthName(month))+' a '+escape(monthName(q.at(-1).mese))}</strong> · Vedi quote</summary><div class="quote-list" style="margin-top:10px">${q.map(x=>`<div class="quote-item">${escape(monthName(x.mese))}<br><strong>${euro(x.importo)}</strong>${seed.history[x.mese]?'<div class="sub">Storico Excel presente</div>':''}</div>`).join('')}</div></details><div class="status" style="margin-top:6px">${included?'Queste quote verranno incluse nel bilancino dopo la conferma.':'Le quote saranno registrate ma escluse dal bilancino: verifica se la fattura è già nello storico Excel.'}</div>`}
async function handleInvoiceUpload(){const files=[...document.getElementById('invoiceFiles').files],status=document.getElementById('importStatus'),preview=document.getElementById('invoicePreview');if(!files.length){status.textContent='Scegli almeno un file.';return}status.textContent='Lettura in corso…';preview.innerHTML='';try{const parsed=await parseUploadedFiles(files,x=>status.textContent=x);const grouped=new Map();for(const r of parsed.rows){const old=grouped.get(r.chiave);grouped.set(r.chiave,old?{...old,...r,imponibile:r.imponibile??old.imponibile,totale_documento:r.totale_documento??old.totale_documento,fonte:old.fonte.includes('PDF')||r.fonte==='PDF'?'PDF + Excel':r.fonte,pdf_data:r.pdf_data||old.pdf_data,nome_pdf:r.nome_pdf||old.nome_pdf,dettaglio:r.dettaglio||old.dettaglio}:r)}
 state.invoicePreview=[...grouped.values()];const existing=new Set(state.invoices.map(x=>x.chiave));const fresh=state.invoicePreview.filter(x=>!existing.has(x.chiave)),attach=state.invoicePreview.filter(x=>x.pdf_data&&!state.invoices.find(f=>f.chiave===x.chiave)?.pdf_disponibile);status.textContent=`${parsed.rows.length} letture, ${state.invoicePreview.length} fatture distinte, ${fresh.length} nuove, ${attach.length} PDF da archiviare, ${parsed.issues.length} da controllare.`;
 preview.innerHTML=`<p class="muted">${state.invoicePreview.filter(x=>x.imponibile!==null).length} con imponibile ricavato dal PDF. ${state.invoicePreview.filter(x=>x.imponibile===null).length} richiedono verifica manuale. I PDF caricati vengono archiviati nell'app e si aprono dalla fattura. Conserva comunque lo ZIP originale.</p>${parsed.issues.length?`<details><summary>${parsed.issues.length} file da verificare</summary><ul>${parsed.issues.map(x=>`<li>${escape(x.file)}: ${escape(x.reason)}</li>`).join('')}</ul></details>`:''}<button class="btn" id="commitInvoices" ${!fresh.length&&!attach.length?'disabled':''}>Salva ${fresh.length} nuove fatture e ${attach.length} PDF</button>`;
 document.getElementById('commitInvoices').onclick=commitInvoices;
 }catch(e){status.textContent='Lettura non riuscita: '+e.message}}
async function commitInvoices(){const button=document.getElementById('commitInvoices'),status=document.getElementById('importStatus');button.disabled=true;const existing=new Map(state.invoices.map(x=>[x.chiave,x]));let saved=0,attached=0,skipped=0,errors=[];
 for(const r of state.invoicePreview){const found=existing.get(r.chiave);let id=found?.id;
 if(found){const patch={};if(found.imponibile===null&&r.imponibile!==null)patch.imponibile=r.imponibile;if(!found.dettaglio?.length&&r.dettaglio?.length)patch.dettaglio=r.dettaglio;if(found.totale_documento===null&&r.totale_documento!==null)patch.totale_documento=r.totale_documento;
 if(Object.keys(patch).length){patch.fonte=r.fonte;patch.aggiornato_il=new Date().toISOString();const {error}=await db.from('AmministrativoFatture').update(patch).eq('id',id);if(error){errors.push(r.numero+': '+error.message);continue}else saved++}else skipped++
 }else{const payload={chiave:r.chiave,fornitore:r.fornitore,partita_iva:r.partita_iva,numero:r.numero,tipo_documento:r.tipo_documento,data_documento:r.data_documento,imponibile:r.imponibile,totale_documento:r.totale_documento??null,fonte:r.fonte,dettaglio:r.dettaglio||null,mese_competenza:r.data_documento.slice(0,7),includi_bilancino:!seed.history[r.data_documento.slice(0,7)]};const {data,error}=await db.from('AmministrativoFatture').insert(payload).select('id').single();if(error){errors.push(r.numero+': '+error.message);continue}id=data.id;saved++}
 if(r.pdf_data&&!found?.pdf_disponibile){const {error}=await db.from('AmministrativoPdf').upsert({fattura_id:id,nome_file:r.nome_pdf,contenuto_base64:r.pdf_data},{onConflict:'fattura_id',ignoreDuplicates:true});if(error)errors.push('PDF '+r.numero+': '+error.message);else attached++}
 status.textContent=`Salvate ${saved} fatture, archiviati ${attached} PDF, ${errors.length} errori…`}
 await loadData();render();notify(`${saved} fatture inserite o aggiornate, ${attached} PDF archiviati.${errors.length?' Problemi: '+errors.slice(0,4).join('; '):''}`,!!errors.length)}
async function openInvoicePdf(id){const w=window.open('','_blank');if(w)w.opener=null;const {data,error}=await db.from('AmministrativoPdf').select('nome_file,contenuto_base64').eq('fattura_id',id).maybeSingle();if(error||!data){if(w)w.close();notify('PDF non disponibile: '+(error?.message||'documento non trovato'),true);return}const blob=new Blob([base64ToBytes(data.contenuto_base64)],{type:'application/pdf'}),url=URL.createObjectURL(blob);if(w)w.location.href=url;else{const link=document.createElement('a');link.href=url;link.download=data.nome_file;link.click()}setTimeout(()=>URL.revokeObjectURL(url),300000)}
async function saveInvoice(id,confirm){const f=state.invoices.find(x=>x.id===id),box=main.querySelector(`[data-invoice="${id}"]`),v=k=>box.querySelector(`[data-field="${k}"]`),msg=v('message');const amount=Number(v('imponibile').value),categoryId=v('categoria_id').value,month=v('mese_competenza').value,duration=invoiceDuration(box),include=v('includi_bilancino').checked;
 if(!/^\d{4}-\d{2}$/.test(month)||!Number.isInteger(duration)||duration<1||duration>120||!Number.isFinite(amount)||amount<=0){msg.textContent='Controlla imponibile, mese e durata.';return}if(confirm&&(!categoryId||category(categoryId)?.tipo!=='costo')){msg.textContent='Scegli una categoria di spesa.';return}
 if(confirm&&include&&Array.from({length:duration},(_,i)=>monthAdd(month,i)).some(m=>seed.history[m])&&!window.confirm('Uno o più mesi sono già presenti nel bilancino Excel: hai controllato che la fattura non sia già compresa?'))return;
 const payload={imponibile:amount,categoria_id:categoryId||null,mese_competenza:month,durata_mesi:duration,includi_bilancino:include,note:v('note').value.trim()||null,aggiornato_il:new Date().toISOString()};msg.textContent='Salvataggio…';
 const {error:stageErr}=await db.from('AmministrativoFatture').update(payload).eq('id',id);if(stageErr){msg.textContent=stageErr.message;return}
 if(confirm){const old=state.movements.find(m=>m.fattura_id===id);const movement={fattura_id:id,tipo:'costo',categoria_id:categoryId,descrizione:`Fattura ${f.numero} · ${f.fornitore}`.slice(0,250),importo:amount,data_documento:f.data_documento,fornitore:f.fornitore,riferimento:f.numero,note:payload.note,quote:equalQuotes(Math.round(amount*100),month,duration),includi_bilancino:include,aggiornato_il:new Date().toISOString()};const {data,error}=old?await db.from('AmministrativoMovimenti').update(movement).eq('id',old.id).select('id').single():await db.from('AmministrativoMovimenti').insert(movement).select('id').single();if(error){msg.textContent='Fattura verificata, ma la registrazione non è riuscita: '+error.message;await loadData();return}const {error:linkErr}=await db.from('AmministrativoFatture').update({movimento_id:data.id}).eq('id',id);if(linkErr){msg.textContent='Movimento salvato. Ricarica la pagina per ripristinare il collegamento: '+linkErr.message;await loadData();return}}
 if(v('ricorda').checked&&categoryId){const {error}=await db.from('AmministrativoRegoleFornitori').upsert({partita_iva:f.partita_iva,nome:f.fornitore,categoria_id:categoryId,aggiornato_il:new Date().toISOString()},{onConflict:'partita_iva'});if(error){msg.textContent='Fattura salvata, regola fornitore non salvata: '+error.message;await loadData();return}}
 await loadData();render();notify(confirm?'Fattura registrata con la ripartizione indicata.':'Verifica della fattura salvata.')}

async function loadData(){const [cats,movs,inv,rules,pdfs,history]=await Promise.all([allRows('AmministrativoCategorie','ordine'),allRows('AmministrativoMovimenti','creato_il'),allRows('AmministrativoFatture','creato_il'),allRows('AmministrativoRegoleFornitori','partita_iva'),allRows('AmministrativoPdf','fattura_id','fattura_id'),allRows('AmministrativoStorico','mese')]);seed.history=Object.fromEntries(history.map(x=>[x.mese,x.valori]));state.categories=cats;state.movements=movs;const hasPdf=new Set(pdfs.map(x=>x.fattura_id));state.invoices=inv.map(f=>({...f,pdf_disponibile:hasPdf.has(f.id),movimento_id:f.movimento_id||movs.find(m=>m.fattura_id===f.id)?.id||null}));state.rules=rules}
async function activate(session){if(!session){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');return}const {data,error}=await db.from('NexusProfili').select('Ruolo,Attivo').eq('UserID',session.user.id).maybeSingle();if(error||!data||!['admin','amministrazione'].includes(data.Ruolo)||!data.Attivo){await db.auth.signOut();document.getElementById('loginError').textContent='Il profilo non è abilitato ad Amministrativo Nexus.';return}
  try{await loadData();document.getElementById('userEmail').textContent=session.user.email||'';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}catch(e){document.getElementById('loginError').textContent='Impossibile caricare i dati: '+e.message;document.getElementById('login').classList.remove('hidden')}}
document.getElementById('nav').onclick=e=>{if(e.target.dataset.page)page(e.target.dataset.page)};
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();document.getElementById('loginError').textContent='Accesso…';const {data,error}=await db.auth.signInWithPassword({email:val('email'),password:val('password')});if(error){document.getElementById('loginError').textContent=error.message;return}document.getElementById('loginError').textContent='';await activate(data.session)};
const {data:{session}}=await db.auth.getSession();await activate(session);
</script>
