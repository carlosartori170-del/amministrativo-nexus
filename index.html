<script type="module">

const state={page:'bilancino',access:'none',isAdmin:false,backupBusy:false,backupResult:null,month:currentMonth,categories:[],movements:[],edit:null,breakdown:null,detail:null,registerMonth:'',manualMonth:'',manualEdit:null,analysisFrom:'',analysisTo:'',analysisPreset:12,analysisCategory:'',analysisFocus:'',invoices:[],pendingPdf:[],rules:[],invoiceFilter:'operational',invoicePaid:'all',invoicePaymentMethod:'all',invoiceDueFrom:'',invoiceDueTo:'',invoiceMonth:'',invoiceSupplier:'',invoicePreview:[],issued:[],issuedFilter:'pending',issuedPreview:[],people:[],personnelTypes:[],personnelDeadlines:[],personnelDetails:[],personnelHistory:[],warehouses:[],peopleLoaded:false,peopleError:'',personId:null,personSearch:'',personStatus:'active',personLocation:'all',personContract:'all',deadlineFilter:'soon',deadlineFrom:'',deadlineTo:'',deadlineEdit:null,deadlinePrefill:null,typeEdit:null,staffImport:null,staffImportMessage:'',personEdit:false,personNew:false,renewalFrom:null};

function category(id){return state.categories.find(c=>c.id===id)}
function summary(month){const by=new Map();for(const c of state.categories)by.set(c.id,{c,history:0,new:0});
  const base=seed.history[month]||{};for(const [name,amount] of Object.entries(base)){const c=state.categories.find(x=>x.storico_nome===name);if(c)by.get(c.id).history+=Number(amount)}
  if(month>=analysisStartMonth)for(const m of state.movements.filter(x=>!x.annullato&&x.includi_bilancino!==false&&(!(x.fattura_id||x.fattura_emessa_id)||x.data_documento?.slice(0,7)>=analysisStartMonth))){const part=(m.quote||[]).find(q=>q.mese===month);if(part&&by.has(m.categoria_id))by.get(m.categoria_id).new+=Number(part.importo)}
  const rows=[...by.values()].filter(x=>Math.round((x.history+x.new)*100)>0).map(x=>({...x,total:x.history+x.new}));
  const revenue=rows.filter(x=>x.c.tipo==='ricavo').reduce((s,x)=>s+x.total,0);const expense=rows.filter(x=>x.c.tipo==='costo').reduce((s,x)=>s+x.total,0);

const staffReadOnly=()=>state.access==='personale_lettura';

const shortEuro=n=>Math.abs(n)>=1000000?num(n/1000000)+' mln €':Math.abs(n)>=1000?num(n/1000)+' mila €':euro(n);
function analysisAvailable(){return [...new Set([...Object.keys(seed.history),...state.movements.filter(m=>!m.annullato&&m.includi_bilancino!==false).flatMap(m=>(m.quote||[]).map(q=>q.mese))])].filter(m=>/^\d{4}-(0[1-9]|1[0-2])$/.test(m)&&m<=currentMonth).sort()}

function analysisLineChart(points){const w=960,h=295,l=122,r=24,t=24,b=46,pw=w-l-r,ph=h-t-b,max=Math.max(1,...points.flatMap(x=>[x.revenue,x.expense])),x=i=>l+(i+.5)*pw/points.length,y=v=>t+ph-v/max*ph,colors={revenue:'#168764',expense:'#dc9365'};const grid=[0,.25,.5,.75,1].map(p=>`<line class="chart-grid" x1="${l}" y1="${y(max*p)}" x2="${w-r}" y2="${y(max*p)}"/><text x="${l-12}" y="${y(max*p)+4}" text-anchor="end">${escape(shortEuro(max*p))}</text>`).join('');
 const ticks=points.map((p,i)=>i%Math.max(1,Math.ceil(points.length/10))===0||i===points.length-1?`<text x="${x(i)}" y="${h-14}" text-anchor="middle">${escape(p.m.slice(5)+'/'+p.m.slice(2,4))}</text>`:'').join('');
 const line=(key)=>{let segments=[],current=[];for(let i=0;i<points.length;i++){if(!points[i].hasData){if(current.length)segments.push(current);current=[]}else current.push(`${x(i)},${y(points[i][key])}`)}if(current.length)segments.push(current);return segments.map(s=>s.length===1?`<circle cx="${s[0].split(',')[0]}" cy="${s[0].split(',')[1]}" r="4" fill="${colors[key]}"/>`:`<polyline points="${s.join(' ')}" fill="none" stroke="${colors[key]}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`).join('')};
 return `<svg class="analysis-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Andamento mensile di ricavi e costi">${grid}${ticks}${line('revenue')}${line('expense')}${points.map((p,i)=>p.hasData?`<circle cx="${x(i)}" cy="${y(p.revenue)}" r="3.5" fill="${colors.revenue}"/><circle cx="${x(i)}" cy="${y(p.expense)}" r="3.5" fill="${colors.expense}"/>`:'').join('')}${points.map((p,i)=>`<rect class="chart-target" data-analysis-month="${p.m}" x="${l+i*pw/points.length}" y="${t}" width="${pw/points.length}" height="${ph}" fill="transparent" role="button" tabindex="0" aria-label="${escape(monthName(p.m))}: ${p.hasData?'ricavi '+euro(p.revenue)+', costi '+euro(p.expense):'nessun dato'}"/>`).join('')}</svg>`}
function analysisResultChart(points){const w=960,h=230,l=122,r=24,t=21,b=45,pw=w-l-r,ph=h-t-b,low=Math.min(0,...points.map(x=>x.result)),high=Math.max(0,...points.map(x=>x.result)),span=Math.max(high-low,1),y=v=>t+(high-v)/span*ph,zero=y(0),x=i=>l+(i+.5)*pw/points.length,bw=Math.max(5,Math.min(27,pw/points.length*.55));return `<svg class="analysis-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Risultato mensile positivo o negativo"><line class="chart-grid" x1="${l}" y1="${zero}" x2="${w-r}" y2="${zero}"/><text x="${l-12}" y="${zero+4}" text-anchor="end">0 €</text>${points.map((p,i)=>p.hasData?`<rect x="${x(i)-bw/2}" y="${Math.min(y(p.result),zero)}" width="${bw}" height="${Math.max(2,Math.abs(y(p.result)-zero))}" rx="4" fill="${p.result>=0?'#249568':'#cf715e'}"/>`:'').join('')}${points.map((p,i)=>i%Math.max(1,Math.ceil(points.length/10))===0||i===points.length-1?`<text x="${x(i)}" y="${h-13}" text-anchor="middle">${escape(p.m.slice(5)+'/'+p.m.slice(2,4))}</text>`:'').join('')}${points.map((p,i)=>`<rect class="chart-target" data-analysis-month="${p.m}" x="${l+i*pw/points.length}" y="${t}" width="${pw/points.length}" height="${ph}" fill="transparent" role="button" tabindex="0" aria-label="${escape(monthName(p.m))}: ${p.hasData?euro(p.result):'nessun dato'}"/>`).join('')}</svg>`}

function renderBackup(){if(!state.isAdmin)return;const last=state.backupResult;main.innerHTML=`<div class="section-title"><h2>Backup Nexus</h2></div><section class="card"><h3>Scarica una copia dei dati di tutte le applicazioni</h3><p>Include le tabelle del gestionale, dei turni e dell’amministrazione, lo storico, gli utenti e le definizioni di tabelle, funzioni e regole di accesso. I PDF delle fatture sono esclusi.</p><p class="sub">Scegli una cartella sul PC, anche sincronizzata con OneDrive. Il file ZIP contiene dati e struttura in formato JSON per il recupero tecnico. Non è un ripristino automatico dell’intero progetto Supabase: configurazioni dei servizi, chiavi, segreti e file Storage restano separati.</p><div class="controls"><button class="btn" id="downloadNexusBackup" ${state.backupBusy?'disabled':''}>${state.backupBusy?'Preparazione backup…':'Scarica backup'}</button><span id="backupProgress" class="status" role="status" aria-live="polite"></span></div>${last?`<p class="notice">Ultimo download in questa sessione: ${escape(last.date)} · ${last.tables} tabelle · ${num(last.rows)} righe · ${escape(last.name)}</p>`:''}<p class="sub">La copia comprende tutti i periodi e non dipende dai filtri delle altre sezioni. Nessun dato viene modificato e nessuna vecchia copia viene eliminata. Attendi la conferma di OneDrive per avere anche la copia nel cloud.</p></section>`;document.getElementById('downloadNexusBackup').onclick=downloadNexusBackup}

ura.json':{sha256:sha,bytes:bytes.length}},excluded:info.excluded},null,2));zip.file('LEGGIMI.txt',`BACKUP APPLICATIVO NEXUS\nData: ${info.created_at}\nTabelle: ${info.tables.length}; righe: ${rows}\n\nIl JSON conserva dati, tipi, colonne, vincoli, indici, funzioni, viste, trigger, policy e privilegi delle tabelle public, sequenze e riferimenti utenti (ID ed email).\nPDF e file Storage esclusi. Non comprende password, credenziali e token di accesso, configurazioni dei servizi, chiavi, segreti o codice Edge Functions. Gli accessi vanno riconfigurati in caso di recupero.\nIl file contiene dati riservati: conservarlo nel cloud aziendale con accesso limitato.\nQuesto archivio non è un dump SQL nativo. Il recupero richiede un tecnico e una prova su ambiente separato compatibile con Supabase prima di intervenire in produzione.\nIl manifest permette di verificare il checksum SHA256 del JSON.\n`);const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});progress('Salvataggio sul computer…');if(fileHandle){const writer=await fileHandle.createWritable();try{await writer.write(blob);await writer.close()}catch(e){try{await writer.abort()}catch{}throw e}}else{const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}state.backupResult={date:new Date().toLocaleString('it-IT',{timeZone:'Europe/Rome'}),tables:info.tables.length,rows,name:fileHandle?.name||name};notify(fileHandle?'Backup salvato nella cartella scelta. Attendi la sincronizzazione di OneDrive.':'Download del backup avviato. Salva il file nella cartella desiderata.')}catch(e){status.textContent='Backup non completato: '+(e.message||'errore di connessione');notify(status.textContent,true)}finally{state.backupBusy=false;button.disabled=false;button.textContent='Scarica backup';if(state.backupResult&&state.page==='backup')renderBackup()} function bindCreationEditor(d){const recalc=()=>{const t=invoiceTotals(d);document.getElementById('creationTotals').textContent='Imponibile '+euro(t.net)+' · IVA '+euro(t.vat)+' · Totale '+euro(t.total);d.lines.forEach((l,i)=>{const e=main.querySelector(`[data-line-total="${i}"]`);if(e)e.textContent=euro(invoiceRound(l.qty*l.rate))})};main.querySelectorAll('[data-draft-field]').forEach(el=>el.oninput=()=>{d[el.dataset.draftField]=el.type==='number'?Number(el.value):el.value;creation.dirty=true;document.getElementById('creationSaveStatus').textContent='Modifiche non salvate';recalc()});main.querySelectorAll('[data-line]').forEach(el=>el.oninput=()=>{d.lines[Number(el.dataset.line)][el.dataset.lineKey]=el.type==='number'?Number(el.value):el.value;creation.dirty=true;document.getElementById('creationSaveStatus').textContent='Modifiche non salvate';recalc()});main.querySelectorAll('[data-remove-line]').forEach(el=>el.onclick=()=>{d.lines.splice(Number(el.dataset.removeLine),1);renderCreation();creation.dirty=true;document.getElementById('creationSaveStatus').textContent='Modifiche non salvate'});document.getElementById('addInvoiceLine').onclick=()=>{d.lines.push({desc:'NUOVA VOCE',unit:'colli',qty:0,rate:0});renderCreation();creation.dirty=true;document.getElementById('creationSaveStatus').textContent='Modifiche non salvate'};document.getElementById('saveCreation').onclick=()=>saveCreation(d);document.getElementById('previewCreation').onclick=()=>printCreation(d);recalc()}
function validateCreation(d,print=false){if(!d.date||!d.client.trim()||!d.lines.length)throw Error('Compila data, cliente e almeno una riga.');if(!Number.isFinite(d.vat)||d.vat<0||d.vat>100||d.lines.some(l=>!l.desc.trim()||!Number.isFinite(l.qty)||!Number.isFinite(l.rate)||l.qty<0||l.rate<0))throw Error('Controlla descrizioni, quantità, tariffe e IVA.');if(print&&invoiceTotals(d).net<=0)throw Error('Inserisci un importo positivo prima della stampa.');if(print&&!String(d.number).trim())throw Error('Inserisci il numero della fattura prima della stampa.');if(print&&d.lines.some(l=>l.qty>0&&l.rate===0))throw Error('Completa le tariffe a zero prima della stampa.')}
async function saveCreation(d){try{validateCreation(d);const {id,...content}=d;const {error}=await db.from('AmministrativoBozzeFatture').update({contenuto:content,aggiornato_il:new Date().toISOString()}).eq('id',id);if(error)throw error;creation.dirty=false;document.getElementById('creationSaveStatus').textContent='Modifiche salvate';return true}catch(e){notify(e.message,true);return false}}

window.addEventListener('beforeunload',e=>{if(creation.dirty){e.preventDefault();e.returnValue=''}});
async function loadData(){const [cats,movs,inv,rules,pdfs,history,issued,issuedPdfs,pendingPdf]=await Promise.all([allRows('AmministrativoCategorie','ordine'),allRows('AmministrativoMovimenti','creato_il'),allRows('AmministrativoFatture','creato_il'),allRows('AmministrativoRegoleFornitori','partita_iva'),allRows('AmministrativoPdf','fattura_id','fattura_id'),allRows('AmministrativoStorico','mese'),allRows('AmministrativoFattureEmesse','creato_il'),allRows('AmministrativoPdfEmessi','fattura_id','fattura_id'),allRows('AmministrativoPdfInAttesa','creato_il','chiave,nome_file,fornitore,data_documento,creato_il')]);seed.history=Object.fromEntries(history.map(x=>[x.mese,x.valori]));state.categories=cats;state.movements=movs;state.pendingPdf=pendingPdf;const hasPdf=new Set(pdfs.map(x=>x.fattura_id));state.invoices=inv.map(f=>({...f,pdf_disponibile:hasPdf.has(f.id),movimento_id:f.movimento_id||movs.find(m=>m.fattura_id===f.id)?.id||null}));const hasIssuedPdf=new Set(issuedPdfs.map(x=>x.fattura_id));state.issued=issued.map(f=>({...f,pdf_disponibile:hasIssuedPdf.has(f.id),movimento_id:f.movimento_id||movs.find(m=>m.fattura_emessa_id===f.id)?.id||null}));state.rules=rules}
async function activate(session){if(!session){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');return}const {data,error}=await db.from('NexusProfili').select('Ruolo,Attivo').eq('UserID',session.user.id).maybeSingle();let access=['admin','amministrazione'].includes(data?.Ruolo)&&data?.Attivo?'amministrazione':null;if(!error&&data?.Attivo&&!access){const {data:grant,error:grantError}=await db.from('AmministrativoAccessi').select('Ruolo,Attivo').eq('UserID',session.user.id).maybeSingle();if(!grantError&&grant?.Ruolo==='personale_lettura'&&grant.Attivo)access='personale_lettura'}if(!access){await db.auth.signOut();document.getElementById('loginError').textContent='Il profilo non è abilitato ad Amministrativo Nexus.';return}
  try{state.access=access;state.isAdmin=data?.Ruolo==='admin'&&data?.Attivo===true;document.getElementById('backupNav').classList.toggle('hidden',!state.isAdmin);document.getElementById('creationNav').classList.toggle('hidden',state.access!=='amministrazione');if(staffReadOnly()){state.page='personale';document.querySelector('#nav [data-group="analisi"]').classList.add('hidden');document.querySelectorAll('#nav [data-page="config_personale"],#nav [data-page="import_personale"]').forEach(el=>el.remove());document.querySelector('#app .brand .sub').textContent='Elenco personale · sola visualizzazione';await loadPersonnelData();if(!state.peopleLoaded)throw Error(state.peopleError||'Elenco personale non disponibile')}else await loadData();document.getElementById('userEmail').textContent=session.user.email||'';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');page(state.page)}catch(e){document.getElementById('loginError').textContent='Impossibile caricare i dati: '+e.message;document.getElementById('login').classList.remove('hidden')}}
document.getElementById('nav').onclick=e=>{if(e.target.dataset.page)page(e.target.dataset.page)};
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();document.getElementById('loginError').textContent='Accesso…';const {data,error}=await db.auth.signInWithPassword({email:val('email'),password:val('password')});if(error){document.getElementById('loginError').textContent=error.message;return}document.getElementById('loginError').textContent='';await activate(data.session)};
const {data:{session}}=await db.auth.getSession();await activate(session);
</script>
