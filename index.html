<script type="module">

const state={page:'bilancino',month:currentMonth,categories:[],movements:[],edit:null,breakdown:null,detail:null,registerMonth:'',manualMonth:'',manualEdit:null,manualCategoryId:null,analysisFrom:'',analysisTo:'',analysisPreset:12,analysisCategory:'',analysisFocus:'',invoices:[],rules:[],invoiceFilter:'pending',invoicePreview:[],issued:[],issuedFilter:'pending',issuedPreview:[],people:[],personnelTypes:[],personnelDeadlines:[],peopleLoaded:false,peopleError:'',personId:null,personSearch:'',personStatus:'active',deadlineFilter:'soon',deadlineEdit:null,deadlinePrefill:null,typeEdit:null,staffImport:null,staffImportMessage:''};

  const base=seed.history[month]||{};for(const [name,amount] of Object.entries(base)){const c=state.categories.find(x=>x.storico_nome===name);if(c)by.get(c.id).history+=Number(amount)}
  for(const m of state.movements.filter(x=>!x.annullato&&x.includi_bilancino!==false)){const part=(m.quote||[]).find(q=>q.mese===month);if(part&&by.has(m.categoria_id))by.get(m.categoria_id).new+=Number(part.importo)}

  const revenue=rows.filter(x=>x.c.tipo==='ricavo').reduce((s,x)=>s+x.total,0);const expense=rows.filter(x=>x.c.tipo==='costo').reduce((s,x)=>s+x.total,0);

function page(name){state.page=name;state.breakdown=null;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===name));document.querySelectorAll('[data-group-summary]').forEach(x=>x.classList.toggle('active',(x.dataset.groupSummary==='personale')===['personale','scadenze','config_personale','import_personale'].includes(name)));document.querySelectorAll('#nav details').forEach(x=>x.open=false);render();if(['personale','scadenze','config_personale','import_personale'].includes(name)&&!state.peopleLoaded)loadPersonnelData()}

const shortEuro=n=>Math.abs(n)>=1000000?num(n/1000000)+' mln €':Math.abs(n)>=1000?num(n/1000)+' mila €':euro(n);
function analysisAvailable(){return [...new Set([...Object.keys(seed.history),...state.movements.filter(m=>!m.annullato&&m.includi_bilancino!==false).flatMap(m=>(m.quote||[]).map(q=>q.mese))])].filter(m=>/^\d{4}-(0[1-9]|1[0-2])$/.test(m)&&m<=currentMonth).sort()}
function analysisRange(from,to){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(from)||!/^\d{4}-(0[1-9]|1[0-2])$/.test(to)||from>to)return [];const months=[];for(let m=from;m<=to&&months.length<=60;m=monthAdd(m,1))months.push(m);return months.length<=60?months:[]}
function analysisLineChart(points){const w=960,h=295,l=122,r=24,t=24,b=46,pw=w-l-r,ph=h-t-b,max=Math.max(1,...points.flatMap(x=>[x.revenue,x.expense])),x=i=>l+(i+.5)*pw/points.length,y=v=>t+ph-v/max*ph,colors={revenue:'#168764',expense:'#dc9365'};const grid=[0,.25,.5,.75,1].map(p=>`<line class="chart-grid" x1="${l}" y1="${y(max*p)}" x2="${w-r}" y2="${y(max*p)}"/><text x="${l-12}" y="${y(max*p)+4}" text-anchor="end">${escape(shortEuro(max*p))}</text>`).join('');

 const line=(key)=>{let segments=[],current=[];for(let i=0;i<points.length;i++){if(!points[i].hasData){if(current.length)segments.push(current);current=[]}else current.push(`${x(i)},${y(points[i][key])}`)}if(current.length)segments.push(current);return segments.map(s=>s.length===1?`<circle cx="${s[0].split(',')[0]}" cy="${s[0].split(',')[1]}" r="4" fill="${colors[key]}"/>`:`<polyline points="${s.join(' ')}" fill="none" stroke="${colors[key]}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`).join('')};
 return `<svg class="analysis-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Andamento mensile di ricavi e costi">${grid}${ticks}${line('revenue')}${line('expense')}${points.map((p,i)=>p.hasData?`<circle cx="${x(i)}" cy="${y(p.revenue)}" r="3.5" fill="${colors.revenue}"/><circle cx="${x(i)}" cy="${y(p.expense)}" r="3.5" fill="${colors.expense}"/>`:'').join('')}${points.map((p,i)=>`<rect class="chart-target" data-analysis-month="${p.m}" x="${l+i*pw/points.length}" y="${t}" width="${pw/points.length}" height="${ph}" fill="transparent" role="button" tabindex="0" aria-label="${escape(monthName(p.m))}: ${p.hasData?'ricavi '+euro(p.revenue)+', costi '+euro(p.expense):'nessun dato'}"/>`).join('')}</svg>`}
function analysisResultChart(points){const w=960,h=230,l=122,r=24,t=21,b=45,pw=w-l-r,ph=h-t-b,low=Math.min(0,...points.map(x=>x.result)),high=Math.max(0,...points.map(x=>x.result)),span=Math.max(high-low,1),y=v=>t+(high-v)/span*ph,zero=y(0),x=i=>l+(i+.5)*pw/points.length,bw=Math.max(5,Math.min(27,pw/points.length*.55));return `<svg class="analysis-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Risultato mensile positivo o negativo"><line class="chart-grid" x1="${l}" y1="${zero}" x2="${w-r}" y2="${zero}"/><text x="${l-12}" y="${zero+4}" text-anchor="end">0 €</text>${points.map((p,i)=>p.hasData?`<rect x="${x(i)-bw/2}" y="${Math.min(y(p.result),zero)}" width="${bw}" height="${Math.max(2,Math.abs(y(p.result)-zero))}" rx="4" fill="${p.result>=0?'#249568':'#cf715e'}"/>`:'').join('')}${points.map((p,i)=>i%Math.max(1,Math.ceil(points.length/10))===0||i===points.length-1?`<text x="${x(i)}" y="${h-13}" text-anchor="middle">${escape(p.m.slice(5)+'/'+p.m.slice(2,4))}</text>`:'').join('')}${points.map((p,i)=>`<rect class="chart-target" data-analysis-month="${p.m}" x="${l+i*pw/points.length}" y="${t}" width="${pw/points.length}" height="${ph}" fill="transparent" role="button" tabindex="0" aria-label="${escape(monthName(p.m))}: ${p.hasData?euro(p.result):'nessun dato'}"/>`).join('')}</svg>`}
function analysisCategoryChart(points,catId){const totalExpense=points.reduce((sum,p)=>sum+p.expense,0),totals=new Map();for(const p of points)for(const row of p.rows)if(row.c.tipo==='costo')totals.set(row.c.id,(totals.get(row.c.id)||0)+row.total);
 if(catId){const c=category(catId),data=points.map(p=>({m:p.m,value:p.rows.find(x=>x.c.id===catId)?.total||0})),max=Math.max(1,...data.map(x=>x.value));return `<div class="row" style="margin-bottom:16px"><strong>${escape(c?.nome||'Categoria')}</strong><span class="pill">${euro(totals.get(catId)||0)} · ${totalExpense?num((totals.get(catId)||0)/totalExpense*100)+'% dei costi':'—'}</span></div><div class="chart-wrap"><svg class="analysis-svg" viewBox="0 0 960 190" role="img" aria-label="Andamento mensile della categoria selezionata">${[0,.5,1].map(f=>`<line class="chart-grid" x1="122" y1="${155-f*130}" x2="940" y2="${155-f*130}"/><text x="110" y="${159-f*130}" text-anchor="end">${escape(shortEuro(max*f))}</text>`).join('')}${data.map((p,i)=>{const cw=814/data.length,x=122+i*cw+cw*.2,height=p.value/max*130;return `<rect x="${x}" y="${155-height}" width="${cw*.6}" height="${height}" rx="4" fill="#649e83"><title>${escape(monthName(p.m))}: ${euro(p.value)}</title></rect>`}).join('')}${data.map((p,i)=>i%Math.max(1,Math.ceil(data.length/10))===0||i===data.length-1?`<text x="${122+(i+.5)*814/data.length}" y="178" text-anchor="middle">${escape(p.m.slice(5)+'/'+p.m.slice(2,4))}</text>`:'').join('')}</svg></div>`}

function renderAnalisi(){const available=analysisAvailable(),latest=available.at(-1)||currentMonth;if(!state.analysisFrom||!state.analysisTo){state.analysisTo=latest;state.analysisFrom=monthAdd(latest,-11)}const months=analysisRange(state.analysisFrom,state.analysisTo),valid=months.length>0,points=months.map(m=>({m,...summary(m)})),filled=points.filter(p=>p.hasData),revenue=points.reduce((s,p)=>s+p.revenue,0),expense=points.reduce((s,p)=>s+p.expense,0),result=revenue-expense,margin=revenue?result/revenue*100:0,focus=points.find(x=>x.m===state.analysisFocus)||filled.at(-1)||points.at(-1),c=category(state.analysisCategory);
 main.innerHTML=`<div class="section-title"><div><h2>Analisi aziendale</h2><div class="muted">Ricavi, costi e risultato di tutta Nexus per mese di competenza</div></div><button class="btn secondary small" id="analysisExport" ${valid?'':'disabled'}>Esporta CSV</button></div>

function showEntry(m,options={}){state.edit=m?.id||null;const box=document.getElementById('entryForm');box.classList.remove('hidden');const firstMonth=m?.quote?.[0]?.mese||options.month||'2026-09';const length=m?.quote?.length||1;const preset=[1,3,6,12,24,36].includes(length)?String(length):'custom';const today=new Date();const todayLocal=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

 <div class="two"><section class="card"><h3>${current?'Modifica voce':'Nuovo corso o visita'}</h3><form id="staffTypeForm" class="stack"><label class="field">Tipo<select id="staffTypeKind"><option value="corso" ${current?.tipo==='corso'?'selected':''}>Corso</option><option value="visita" ${current?.tipo==='visita'?'selected':''}>Visita medica</option></select></label><label class="field">Nome<input id="staffTypeName" maxlength="120" required value="${escape(current?.nome||'')}" placeholder="Es. Sicurezza generale"></label><label class="field">Validità (mesi)<input id="staffTypeMonths" type="number" min="1" max="120" required value="${current?.validita_mesi||12}"></label><label class="field" id="staffHoursField">Durata del corso (ore, facoltativa)<input id="staffTypeHours" type="number" min="0.5" max="1000" step="0.5" value="${current?.durata_ore??''}"></label><div class="controls"><button class="btn" type="submit">${current?'Salva modifiche':'Aggiungi voce'}</button>${current?'<button class="btn secondary" type="button" id="resetStaffType">Nuova voce</button>':''}</div><div id="staffTypeMessage" class="status"></div></form></section>
 <section class="card"><h3>Corsi e visite configurati</h3>${state.personnelTypes.length?`<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Validità</th><th>Durata</th><th>Stato</th><th></th></tr></thead><tbody>${state.personnelTypes.map(x=>`<tr><td>${escape(x.nome)}</td><td>${x.tipo==='corso'?'Corso':'Visita'}</td><td>${x.validita_mesi} mesi</td><td>${x.durata_ore?num(x.durata_ore)+' h':'—'}</td><td>${x.attivo?'Attiva':'Nascosta'}</td><td><div class="controls"><button class="btn secondary small" data-staff-type-edit="${x.id}">Modifica</button><button class="btn secondary small" data-staff-type-toggle="${x.id}">${x.attivo?'Nascondi':'Riattiva'}</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aggiungi il primo corso o la prima visita.</div>'}</section></div>`;
 const toggleHours=()=>document.getElementById('staffHoursField').classList.toggle('hidden',val('staffTypeKind')!=='corso');document.getElementById('staffTypeKind').onchange=toggleHours;toggleHours();document.getElementById('staffTypeForm').onsubmit=saveStaffType;document.getElementById('resetStaffType')?.addEventListener('click',()=>{state.typeEdit=null;render()});

async function saveStaffType(e){e.preventDefault();const msg=document.getElementById('staffTypeMessage'),type=val('staffTypeKind'),name=val('staffTypeName')?.trim(),months=Number(val('staffTypeMonths')),hours=val('staffTypeHours')?Number(val('staffTypeHours')):null;if(!name||!Number.isInteger(months)||months<1||months>120||type==='corso'&&hours!==null&&(!Number.isFinite(hours)||hours<=0||hours>1000)){msg.textContent='Controlla nome, validità e durata.';return}
 const payload={tipo:type,nome:name,validita_mesi:months,durata_ore:type==='corso'?hours:null,aggiornato_il:new Date().toISOString()};msg.textContent='Salvataggio…';const {error}=state.typeEdit?await db.from('AmministrativoTipiFormazione').update(payload).eq('id',state.typeEdit).select('id').single():await db.from('AmministrativoTipiFormazione').insert(payload).select('id').single();if(error){msg.textContent=error.message;return}await loadPersonnelData();state.typeEdit=null;render();notify('Configurazione salvata.')}
async function toggleStaffType(id){const x=state.personnelTypes.find(t=>t.id===id);if(!x)return;const {error}=await db.from('AmministrativoTipiFormazione').update({attivo:!x.attivo,aggiornato_il:new Date().toISOString()}).eq('id',id).select('id').single();if(error){notify(error.message,true);return}await loadPersonnelData();render();notify('Voce aggiornata.')}
const staffNameKey=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim().replace(/\s+/g,' ');
const staffTaxKey=s=>{const x=String(s||'').trim().toUpperCase();return /^[A-Z]{6}[A-Z0-9]{2}[A-Z][0-9]{2}[A-Z][0-9]{3}[A-Z]$/.test(x)?x:''};
function excelStaffDate(x,XLSX){if(x instanceof Date&&!Number.isNaN(x.valueOf()))return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;if(typeof x==='number'){const p=XLSX.SSF.parse_date_code(x);return p&&p.y>1900&&p.y<2100?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:''}const s=String(x||'').trim(),d=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);if(d){const date=`${d[3]}-${d[2].padStart(2,'0')}-${d[1].padStart(2,'0')}`;return !Number.isNaN(Date.parse(date+'T12:00:00Z'))?date:''}return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s+'T12:00:00Z'))?s:''}
async function readStaffWorkbook(file){if(!/\.xlsx$/i.test(file.name)||file.size>12*1024*1024)throw Error('Carica un file .xlsx fino a 12 MB.');const XLSX=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/xlsx.mjs');if(typeof XLSX.read!=='function'||typeof XLSX.utils?.sheet_to_json!=='function')throw Error('Lettore Excel non disponibile. Ricarica la pagina e riprova.');const book=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const a=book.Sheets[book.SheetNames[0]],d=book.Sheets[book.SheetNames[1]];if(!a||!d||staffNameKey(book.SheetNames[0])!=='ASSUNTI'||staffNameKey(book.SheetNames[1])!=='DIMESSI')throw Error('I primi due fogli devono essere ASSUNTI e DIMESSI.');const ar=XLSX.utils.sheet_to_json(a,{header:1,defval:'',blankrows:true}),dr=XLSX.utils.sheet_to_json(d,{header:1,defval:'',blankrows:true});if(staffNameKey(ar[0]?.[3])!=='COGNOME'||staffNameKey(ar[0]?.[4])!=='NOME'||staffNameKey(dr[0]?.[0])!=='COGNOME'||staffNameKey(dr[49]?.[0])!=='COGNOME')throw Error('Le intestazioni del file sono cambiate. Controlla il modello prima di importare.');
 const departedNames=new Set(),departedCodes=new Set();let departedCount=0;for(let i=1;i<dr.length;i++){if(i===49)continue;const r=dr[i]||[],name=staffNameKey(`${r[0]||''} ${r[1]||''}`);if(!name)continue;departedCount++;departedNames.add(name);const code=[r[12],r[13],r[14]].map(staffTaxKey).find(Boolean);if(code)departedCodes.add(code)}
 const rows=[];for(let i=1;i<Math.min(ar.length,140);i++){const r=ar[i]||[],name=String(r[3]||'').trim()+' '+String(r[4]||'').trim();if(!staffNameKey(name))continue;const due=excelStaffDate(r[8],XLSX),hire=excelStaffDate(r[6],XLSX),tax=staffTaxKey(r[16]),code=String(r[5]||'').trim();rows.push({sourceRow:i+1,name:name.trim(),key:staffNameKey(name),hire,due,endText:String(r[8]||''),tax,code,departed:departedNames.has(staffNameKey(name))||!!tax&&departedCodes.has(tax),personId:null,checked:false})}
 const duplicates=new Map();for(const r of rows){const key=r.tax||r.key;duplicates.set(key,(duplicates.get(key)||0)+1)}for(const r of rows)r.duplicate=duplicates.get(r.tax||r.key)>1;return {fileName:file.name,rows,departedCount,firstBlock:dr.slice(1,49).filter(r=>r?.[0]||r?.[1]).length,secondBlock:dr.slice(50).filter(r=>r?.[0]||r?.[1]).length}}
function staffImportInfo(row){const options=state.people.filter(p=>staffNameKey(p.Nome)===row.key),voice=Number(row.code),matching=options.filter(p=>voice&&Number(p.CodiceVoice)===voice);const candidates=matching.length===1?matching:options;const chosen=state.people.find(p=>p.ID_Dipendente===Number(row.personId)),existing=chosen&&state.personnelDeadlines.some(x=>x.dipendente_id===chosen.ID_Dipendente&&x.tipo==='contratto'&&!x.annullato);const flags=[];if(row.departed)flags.push('Presente anche in Dimessi');if(row.duplicate)flags.push('Ripetuto in Assunti');if(!row.due)flags.push(/indeterminato/i.test(row.endText||'')?'Tempo indeterminato: nessuna scadenza':'Senza data di scadenza');if(row.hire&&row.due&&row.due<row.hire)flags.push('Scadenza prima dell’assunzione');if(!chosen)flags.push(options.length>1?'Nome ambiguo':'Dipendente da abbinare');if(chosen&&staffNameKey(chosen.Nome)!==row.key)flags.push('Nome diverso: abbinamento manuale');if(chosen&&!chosen.Attivo)flags.push('Dipendente non attivo nel gestionale');if(chosen&&row.code&&chosen.CodiceVoice&&Number(chosen.CodiceVoice)!==voice)flags.push('Codice Voice differente');if(existing)flags.push('Contratto già registrato nell’app');if(row.due&&row.due<todayIso())flags.push('Data già trascorsa');return {candidates,chosen,existing,flags,blocked:!row.due||!chosen||!chosen.Attivo||!!existing||!!row.hire&&row.due<row.hire}}
function renderStaffImport(){if(!state.peopleLoaded){main.innerHTML=`<h2>Importa Excel personale</h2>${staffLoadHtml()}`;staffLoadButton();return}const imp=state.staffImport,rows=imp?.rows||[],eligible=rows.filter(r=>r.checked&&!staffImportInfo(r).blocked),count=rows.filter(r=>!staffImportInfo(r).blocked&&staffImportInfo(r).flags.length===0).length;
 main.innerHTML=`<h2>Importa Excel personale</h2><section class="card"><p class="muted">Carica il file con ASSUNTI e DIMESSI come primi due fogli. Leggiamo ASSUNTI fino alla riga 140; in DIMESSI distinguiamo le righe 2–49 da quelle dopo l’intestazione alla riga 50. Il file resta nel browser: soltanto le scadenze che confermi vengono salvate.</p><div class="controls"><input type="file" id="staffExcelFile" accept=".xlsx"><button class="btn" id="readStaffExcel">Analizza file</button></div><div id="staffImportMessage" class="status" style="margin-top:10px">${escape(state.staffImportMessage)}</div></section>
 ${imp?`<section class="card" style="margin-top:17px"><h3>Anteprima: ${escape(imp.fileName)}</h3><div class="import-summary"><span class="pill">Assunti: ${rows.length}</span><span class="pill">Dimessi: ${imp.departedCount} (${imp.firstBlock} + ${imp.secondBlock})</span><span class="pill">Senza rilievi: ${count}</span><span class="pill">Selezionati: ${eligible.length}</span></div><p class="sub">Il foglio Dimessi serve a individuare possibili sovrapposizioni. Le sue date non vengono registrate come scadenze dei contratti. Ogni riga selezionata creerà una registrazione distinta nello storico.</p><div class="controls"><button class="btn secondary small" id="selectSafeStaff">Seleziona solo righe senza rilievi</button><button class="btn secondary small" id="clearStaffSelection">Deseleziona tutte</button></div><div class="table-wrap import-table" style="max-height:560px;overflow:auto;margin-top:13px"><table><thead><tr><th>Registra</th><th>Riga</th><th>Persona nel file</th><th>Assunzione</th><th>Scadenza</th><th>Dipendente gestionale</th><th>Verifiche</th></tr></thead><tbody>${rows.map((r,i)=>{const info=staffImportInfo(r);return `<tr><td><input type="checkbox" data-staff-check="${i}" ${r.checked?'checked':''} ${info.blocked?'disabled':''} aria-label="Conferma riga ${r.sourceRow}"></td><td>${r.sourceRow}</td><td>${escape(r.name)}</td><td>${r.hire||'—'}</td><td>${r.due||'—'}</td><td><select data-staff-person="${i}" aria-label="Abbina riga ${r.sourceRow}"><option value="">Seleziona dipendente</option>${state.people.map(p=>`<option value="${p.ID_Dipendente}" ${p.ID_Dipendente===Number(r.personId)?'selected':''}>${escape(p.Nome)} · ID ${p.ID_Dipendente}${p.Attivo?'':' (non attivo)'}</option>`).join('')}</select></td><td><small>${info.flags.length?escape(info.flags.join(' · ')):'Corrispondenza da confermare'}</small></td></tr>`}).join('')}</tbody></table></div><div class="controls" style="margin-top:17px"><button class="btn" id="saveStaffImport" ${eligible.length?'':'disabled'}>Registra ${eligible.length} scadenze selezionate</button><span id="saveStaffImportStatus" class="status"></span></div></section>`:''}`;
 document.getElementById('readStaffExcel').onclick=async()=>{const input=document.getElementById('staffExcelFile'),file=input.files?.[0],status=document.getElementById('staffImportMessage');if(!file){status.textContent='Seleziona un file Excel.';return}status.textContent='Analisi del file…';try{const result=await readStaffWorkbook(file);for(const row of result.rows){const matches=state.people.filter(p=>staffNameKey(p.Nome)===row.key),voice=Number(row.code);const byVoice=matches.filter(p=>voice&&Number(p.CodiceVoice)===voice);if((byVoice.length===1||matches.length===1)&&(!row.code||!byVoice.length||byVoice.length===1))row.personId=(byVoice.length===1?byVoice:matches)[0].ID_Dipendente}state.staffImport=result;state.staffImportMessage='File analizzato. Controlla gli abbinamenti e conferma le righe da registrare.';render()}catch(e){status.textContent='Analisi non riuscita: '+e.message}};
 if(!imp)return;const redraw=()=>{const top=document.querySelector('.import-table')?.scrollTop||0,windowTop=window.scrollY;render();document.querySelector('.import-table').scrollTop=top;window.scrollTo(0,windowTop)};main.querySelectorAll('[data-staff-person]').forEach(el=>el.onchange=()=>{const r=rows[Number(el.dataset.staffPerson)];r.personId=el.value?Number(el.value):null;r.checked=false;redraw()});main.querySelectorAll('[data-staff-check]').forEach(el=>el.onchange=()=>{rows[Number(el.dataset.staffCheck)].checked=el.checked;redraw()});document.getElementById('selectSafeStaff').onclick=()=>{for(const r of rows){const info=staffImportInfo(r);r.checked=!info.blocked&&!info.flags.length}redraw()};document.getElementById('clearStaffSelection').onclick=()=>{for(const r of rows)r.checked=false;redraw()};document.getElementById('saveStaffImport').onclick=saveStaffImport}
async function saveStaffImport(){const imp=state.staffImport;if(!imp)return;const rows=imp.rows.filter(r=>r.checked),status=document.getElementById('saveStaffImportStatus');if(!rows.length)return;const ids=rows.map(r=>r.personId),duplicate=ids.find((id,i)=>ids.indexOf(id)!==i);if(duplicate){status.textContent='Due righe selezionate corrispondono allo stesso dipendente. Seleziona soltanto il contratto aggiornato.';return}if(rows.some(r=>staffImportInfo(r).blocked)){status.textContent='Alcune righe non sono più registrabili. Ricontrolla gli abbinamenti.';return}if(!window.confirm(`Registrare ${rows.length} scadenze contrattuali? Controlla che le date nel file siano aggiornate.`))return;document.getElementById('saveStaffImport').disabled=true;let saved=0;const errors=[];for(const row of rows){status.textContent=`Salvataggio ${saved+errors.length+1}/${rows.length}…`;const payload={dipendente_id:row.personId,tipo:'contratto',catalogo_id:null,data_evento:row.hire||null,data_scadenza:row.due,validita_mesi:null,durata_ore:null,note:`Import Excel ${imp.fileName.slice(0,90)}, ASSUNTI riga ${row.sourceRow}`};const {error}=await db.from('AmministrativoScadenzePersonale').insert(payload);if(error)errors.push(`Riga ${row.sourceRow}: ${error.message}`);else{row.checked=false;saved++}}await loadPersonnelData();state.staffImportMessage=`Registrate ${saved} scadenze.${errors.length?' Da verificare: '+errors.slice(0,3).join(' · '):''}`;render();notify(state.staffImportMessage,!!errors.length)}
async function loadData(){const [cats,movs,inv,rules,pdfs,history,issued,issuedPdfs]=await Promise.all([allRows('AmministrativoCategorie','ordine'),allRows('AmministrativoMovimenti','creato_il'),allRows('AmministrativoFatture','creato_il'),allRows('AmministrativoRegoleFornitori','partita_iva'),allRows('AmministrativoPdf','fattura_id','fattura_id'),allRows('AmministrativoStorico','mese'),allRows('AmministrativoFattureEmesse','creato_il'),allRows('AmministrativoPdfEmessi','fattura_id','fattura_id')]);seed.history=Object.fromEntries(history.map(x=>[x.mese,x.valori]));state.categories=cats;state.movements=movs;const hasPdf=new Set(pdfs.map(x=>x.fattura_id));state.invoices=inv.map(f=>({...f,pdf_disponibile:hasPdf.has(f.id),movimento_id:f.movimento_id||movs.find(m=>m.fattura_id===f.id)?.id||null}));const hasIssuedPdf=new Set(issuedPdfs.map(x=>x.fattura_id));state.issued=issued.map(f=>({...f,pdf_disponibile:hasIssuedPdf.has(f.id),movimento_id:f.movimento_id||movs.find(m=>m.fattura_emessa_id===f.id)?.id||null}));state.rules=rules}
async function activate(session){if(!session){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');return}const {data,error}=await db.from('NexusProfili').select('Ruolo,Attivo').eq('UserID',session.user.id).maybeSingle();if(error||!data||!['admin','amministrazione'].includes(data.Ruolo)||!data.Attivo){await db.auth.signOut();document.getElementById('loginError').textContent='Il profilo non è abilitato ad Amministrativo Nexus.';return}
  try{await loadData();document.getElementById('userEmail').textContent=session.user.email||'';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}catch(e){document.getElementById('loginError').textContent='Impossibile caricare i dati: '+e.message;document.getElementById('login').classList.remove('hidden')}}
